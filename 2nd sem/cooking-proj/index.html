<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeJS - Your Functional Cooking Companion</title>

    <!-- ✅ CSS LINK (VERY IMPORTANT) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🍳 RecipeJS</h1>
    <p>Your Functional Cooking Companion</p>

    <!-- Search -->
    <div class="search-container">
        <input
            type="text"
            id="search-input"
            placeholder="Search recipes or ingredients..."
            autocomplete="off"
        >
        <button id="clear-search" class="clear-btn">✕</button>
    </div>
</header>

<main>
    <section class="controls">
        <div class="filter-group">
            <h3>Filter by Difficulty:</h3>
            <div class="button-group">
                <button class="filter-btn active" data-filter="all">Show All</button>
                <button class="filter-btn" data-filter="easy">Easy</button>
                <button class="filter-btn" data-filter="medium">Medium</button>
                <button class="filter-btn" data-filter="hard">Hard</button>
                <button class="filter-btn" data-filter="quick">Quick (&lt; 30 min)</button>
                <button class="filter-btn" data-filter="favorites">❤️ Favorites</button>
            </div>
        </div>

        <div class="sort-group">
            <h3>Sort by:</h3>
            <div class="button-group">
                <button class="sort-btn" data-sort="name">Name (A-Z)</button>
                <button class="sort-btn" data-sort="time">Time</button>
                <button class="sort-btn" data-sort="none">Default</button>
            </div>
        </div>
    </section>

    <!-- Counter -->
    <div class="recipe-info">
        <p id="recipe-count">Showing 0 of 0 recipes</p>
    </div>

    <!-- ✅ SINGLE container -->
    <div id="recipe-container"></div>
</main>

<script src="app.js"></script>
</body>
</html>
